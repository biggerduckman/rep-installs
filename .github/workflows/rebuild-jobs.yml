name: Rebuild installs from CSV

on:
  push:
    branches: [main]
    paths:
      - "data/jobs.csv"
      - "scripts/**"
      - ".github/workflows/rebuild-jobs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Process jobs and geocode missing pins
        run: python3 scripts/build_from_csv.py

      - name: Commit updated data if anything changed
        run: |
          git add data/jobs.csv data/jobs.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update job coordinates and data [skip ci]"
          git push
